<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Shopping List</h1>

  <label for="item-input">Enter an item:</label>
  <input id="item-input" type="text">
  <button id="add-button" type="button">Add Item</button>

  <ul id="shopping-list"></ul>

  <button id="remove-button" type="button">Remove Last Item</button>

  <h2>Search Items</h2>
  <label for="search-input">Search your list:</label>
  <input id="search-input" type="text">
</body>
</html>
